[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pneumonia"
version = "3.0.0"
description = "Pneumonia vs. normal chest X-ray classification with patient-level evaluation"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.3",
    "torchvision>=0.17",
    "scikit-learn>=1.3",
    "scipy",
    "pillow",
    "pandas",
    "numpy",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
